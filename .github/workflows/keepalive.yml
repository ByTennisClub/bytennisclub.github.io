name: Supabase 깨워 두기
# Supabase 무료 프로젝트는 1주일 동안 요청이 없으면 일시 정지됨
# → 주 2회(월·목 오전 9시, 한국 시간) 가벼운 조회를 한 번 보내 깨워 둠
# 실패하면(이미 정지됐거나 주소·키가 바뀜) 이 작업이 실패로 표시되고 GitHub 이 저장소 주인에게 메일을 보냄
# 저장소에 60일 동안 커밋이 없으면 GitHub 이 예약 실행을 멈춤 → Actions 탭에서 다시 켜면 됨
on:
  schedule:
    - cron: '0 0 * * 1,4'   # UTC 00:00 = 한국 09:00, 월·목
  workflow_dispatch:         # Actions 탭에서 직접 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 에 조회 한 번
        run: |
          # 주소와 공개 키는 사이트 파일에서 읽음 (index.html 또는 config.js)
          url=$(cat index.html config.js 2>/dev/null | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -1)
          key=$(cat index.html config.js 2>/dev/null | grep -oE 'sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]{100,}' | head -1)
          test -n "$url" && test -n "$key" || { echo "Supabase 주소나 키를 찾지 못했어요"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url/rest/v1/club_settings?select=key&limit=1" -H "apikey: $key")
          echo "응답 코드: $code"
          test "$code" = "200"
